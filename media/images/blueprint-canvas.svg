<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="white" stroke="#111" stroke-width="4"/><g font-family="Arial" font-size="24" fill="#111"><text x="40" y="55">Universal Build Workflow — Blueprint Canvas</text><text x="40" y="120">1. Name + one sentence</text><text x="40" y="190">2. Problem</text><text x="430" y="190">3. User</text><text x="800" y="190">4. Desired outcome</text><text x="40" y="290">5. Primary outputs (3–7)</text><text x="40" y="390">6. Scope: IN / OUT</text><text x="40" y="490">7. Constraints</text><text x="650" y="490">8. Success criteria</text><text x="40" y="590">9. Top 3 risks + fallback</text><text x="40" y="690">10. Top 3 unverified assumptions</text></g></svg>